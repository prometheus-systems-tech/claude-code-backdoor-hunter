<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33c3a5"/>
      <stop offset="1" stop-color="#1b7f78"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8fc7e8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M128 36 L204 62 V120 C204 168 172 200 128 220 C84 200 52 168 52 120 V62 Z"
        fill="url(#shield)" stroke="#0d4a47" stroke-width="5" stroke-linejoin="round"/>

  <!-- Bug (the backdoor) -->
  <g transform="translate(112 112)" fill="#c01c28" stroke="#5c0d14" stroke-width="3" stroke-linecap="round">
    <ellipse cx="0" cy="4" rx="15" ry="20"/>
    <circle cx="0" cy="-20" r="9"/>
    <path d="M-15 -4 L-30 -12 M-15 6 L-32 8 M-14 16 L-28 28 M15 -4 L30 -12 M15 6 L32 8 M14 16 L28 28 M-4 -28 L-10 -38 M4 -28 L10 -38" fill="none"/>
  </g>

  <!-- Magnifier -->
  <g>
    <line x1="150" y1="150" x2="196" y2="196" stroke="#f2f4f7" stroke-width="17" stroke-linecap="round"/>
    <line x1="150" y1="150" x2="196" y2="196" stroke="#3b4658" stroke-width="9" stroke-linecap="round"/>
    <circle cx="116" cy="116" r="52" fill="url(#lens)" fill-opacity="0.28"
            stroke="#f2f4f7" stroke-width="12"/>
    <path d="M84 98 A36 36 0 0 1 106 80" fill="none" stroke="#ffffff" stroke-opacity="0.85"
          stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
